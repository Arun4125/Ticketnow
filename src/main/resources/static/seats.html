<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Seats</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="seat-page">

<div class="seat-header">
    <h2>Select Your Seats</h2>

    <div class="seat-legend">
        <div class="legend-box">
            <div class="legend-color green"></div>
            <span>Vacant</span>
        </div>
        <div class="legend-box">
            <div class="legend-color red"></div>
            <span>Occupied</span>
        </div>
        <div class="legend-box">
            <div class="legend-color yellow"></div>
            <span>Selected</span>
        </div>
    </div>
</div>

<div id="seatGrid"></div>

<div class="screen">SCREEN</div>

<div class="info">
    <p>Selected Seats: <span id="selectedSeats"></span></p>
    <button id="confirmBtn">CONFIRM</button>
</div>

<div id="warningMessage" class="warning hidden">
    Please select at least one seat!
</div>

<!-- CUSTOMER + OTP FORM -->
<div id="nameForm" class="name-form hidden">
    <h3>Booking Details</h3>

    <input type="text" id="customerName" placeholder="Your Name">
    <input type="text" id="phone" placeholder="Phone Number">

    <button id="sendOtpBtn">Send OTP</button>

    <input type="text" id="otp" placeholder="Enter OTP" class="hidden">
    <button id="verifyOtpBtn" class="hidden">Verify OTP</button>
    <div id="otpMessage" class="form-message hidden"></div>

    <div class="form-buttons">
        <button id="submitBooking" class="hidden">Submit</button>
        <button id="cancelBooking">Cancel</button>
    </div>
</div>

<div id="successTick" class="success-tick hidden">
    <div class="checkmark"></div>
    <p>Booking Successful!</p>
</div>

<script src="js/seats.js"></script>
</body>
</html>
